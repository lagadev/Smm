<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8DFF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    x="12"
    y="12"
    width="232"
    height="232"
    rx="56"
    fill="url(#bg)"
    filter="url(#shadow)"
  />

  <!-- Growth Arrow -->
  <path
    d="M70 165
       L108 127
       L138 149
       L184 103"
    fill="none"
    stroke="url(#accent)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Arrow Head -->
  <path
    d="M184 103
       L184 138
       L214 73
       L149 73
       L184 103"
    fill="url(#accent)"
  />

  <!-- Decorative Circle -->
  <circle
    cx="76"
    cy="170"
    r="10"
    fill="#FFFFFF"
    opacity=".95"
  />

  <!-- Small Spark -->
  <path
    d="M186 46
       L191 58
       L203 63
       L191 68
       L186 80
       L181 68
       L169 63
       L181 58Z"
    fill="#FFFFFF"
    opacity=".85"
  />
</svg>
