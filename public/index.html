<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Orange 🍊</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
    :root {
      --primary:#E74C3C; --secondary:#F39C12;
      --bg-l:#FDFEFE; --sur-l:#FFFFFF; --txt-l:#2C3E50; --txt2-l:#808B96; --brd-l:#EAEDED;
      --bg-d:#1B2631; --sur-d:#283747; --txt-d:#FDFEFE; --txt2-d:#ABB2B9; --brd-d:#566573;
      --ok:#27AE60; --err:#C0392B; --wait:#F39C12;
      --ff:'Poppins',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--ff);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
    body.light-theme{background:var(--bg-l);color:var(--txt-l)}
    body.dark-theme {background:var(--bg-d);color:var(--txt-d)}

    /* ── layout ── */
    #app{max-width:500px;margin:0 auto;padding-bottom:82px}
    .page{display:none;padding:15px;animation:fadeIn .4s ease}
    .page.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

    /* ── loader ── */
    #app-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
    .light-theme #app-loader{background:var(--bg-l)} .dark-theme #app-loader{background:var(--bg-d)}
    .spinner{width:46px;height:46px;border-radius:50%;border:5px solid transparent;border-top-color:var(--primary);animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #load-pct{font-size:1.1rem;font-weight:600}

    /* ── profile header ── */
    .profile-header{padding:22px 15px;border-bottom:1px solid;display:flex;flex-direction:column;align-items:center;text-align:center}
    .light-theme .profile-header{background:var(--sur-l);border-bottom-color:var(--brd-l)}
    .dark-theme  .profile-header{background:var(--sur-d);border-bottom-color:var(--brd-d)}
    #user-photo{width:80px;height:80px;border-radius:50%;border:4px solid var(--primary);object-fit:cover;margin-bottom:10px}
    #user-name{font-size:1.35rem;font-weight:700;margin-bottom:4px}
    #user-balance-container{font-size:.95rem;font-weight:500}
    #user-balance{font-size:1.1rem;font-weight:700;color:var(--primary)}

    /* ── stats ── */
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
    .stat-card{padding:14px;border-radius:12px;text-align:center;border:1px solid}
    .light-theme .stat-card{background:var(--sur-l);border-color:var(--brd-l)}
    .dark-theme  .stat-card{background:var(--sur-d);border-color:var(--brd-d)}
    .stat-card h3{font-size:.78rem;font-weight:500;text-transform:uppercase;margin-bottom:6px}
    .light-theme .stat-card h3{color:var(--txt2-l)} .dark-theme .stat-card h3{color:var(--txt2-d)}
    .stat-card p{font-size:1.35rem;font-weight:600;color:var(--primary)}

    /* ── chart ── */
    .chart-container{padding:18px;border-radius:12px;margin-top:18px;border:1px solid}
    .light-theme .chart-container{background:var(--sur-l);border-color:var(--brd-l)}
    .dark-theme  .chart-container{background:var(--sur-d);border-color:var(--brd-d)}
    .chart-container h3{margin-bottom:12px;font-size:1rem}
    .chart{display:flex;justify-content:space-around;align-items:flex-end;height:130px;border-left:1px solid;border-bottom:1px solid;padding-top:8px}
    .light-theme .chart{border-color:var(--brd-l)} .dark-theme .chart{border-color:var(--brd-d)}
    .bar{width:11%;background:linear-gradient(to top,var(--primary),var(--secondary));border-radius:4px 4px 0 0;position:relative;cursor:pointer;min-height:2px}
    .bar .tip{position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:2px 6px;border-radius:4px;font-size:.72rem;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
    .bar:hover .tip{opacity:1}
    .chart-labels{display:flex;justify-content:space-around;font-size:.7rem;margin-top:4px;opacity:.7}

    /* ── earning wallet ── */
    .earning-wallet-card{padding:20px;border-radius:12px;margin-bottom:16px;border:1px solid}
    .light-theme .earning-wallet-card{background:var(--sur-l);border-color:var(--brd-l)}
    .dark-theme  .earning-wallet-card{background:var(--sur-d);border-color:var(--brd-d)}
    .earning-wallet-card h3{margin-bottom:6px;font-size:1rem}
    .earning-wallet-card .big-amt{font-size:1.9rem;font-weight:700;color:var(--primary);margin:8px 0}
    .earning-wallet-card small{font-size:.8rem;opacity:.7}

    /* ── progress ── */
    .progress-wrap{margin:16px 0}
    .prog-info{display:flex;justify-content:space-between;font-size:.85rem;font-weight:500;margin-bottom:4px}
    .prog-bg{width:100%;height:9px;border-radius:5px}
    .light-theme .prog-bg{background:var(--brd-l)} .dark-theme .prog-bg{background:var(--brd-d)}
    .prog-fg{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:width .3s}

    /* ── task card ── */
    .task-card{padding:16px;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;gap:14px;border:1px solid}
    .light-theme .task-card{background:var(--sur-l);border-color:var(--brd-l)}
    .dark-theme  .task-card{background:var(--sur-d);border-color:var(--brd-d)}
    .task-icon{width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0}
    .task-info{flex:1;min-width:0} .task-info h3{font-size:1rem;font-weight:600} .task-info p{font-size:.82rem;opacity:.75;margin-top:2px}
    .section-title{font-size:1.1rem;font-weight:700;margin:20px 0 10px}

    /* ── action button ── */
    .action-btn{padding:10px 18px;font-size:.88rem;font-weight:600;color:#fff;border:none;border-radius:8px;cursor:pointer;background:linear-gradient(45deg,var(--primary),var(--secondary));transition:opacity .2s;white-space:nowrap;margin-left:auto;flex-shrink:0}
    .action-btn:disabled{background:#808B96;cursor:not-allowed}
    .action-btn.wide{width:100%;margin:10px 0 0;padding:13px}

    /* ── leaderboard ── */
    .lb-toggle{display:flex;justify-content:space-around;margin-bottom:14px;border-bottom:1px solid}
    .light-theme .lb-toggle{border-color:var(--brd-l)} .dark-theme .lb-toggle{border-color:var(--brd-d)}
    .lb-btn{flex:1;padding:10px;border:none;background:none;font-family:var(--ff);font-size:.95rem;cursor:pointer;padding-bottom:11px;margin-bottom:-1px;border-bottom:2px solid transparent}
    .light-theme .lb-btn{color:var(--txt2-l)} .dark-theme .lb-btn{color:var(--txt2-d)}
    .lb-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
    .lb-list{list-style:none}
    .lb-item{display:flex;align-items:center;padding:10px 12px;margin-bottom:8px;border-radius:10px;gap:10px}
    .light-theme .lb-item{background:var(--sur-l)} .dark-theme .lb-item{background:var(--sur-d)}
    .lb-rank{font-size:1.15rem;font-weight:700;color:var(--primary);width:32px}
    .lb-item img{width:38px;height:38px;border-radius:50%;object-fit:cover}
    .lb-name{flex:1;font-weight:600;font-size:.95rem}
    .lb-score{font-weight:700;color:var(--primary)}

    /* ── history ── */
    .hist-item{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:10px;margin-bottom:10px;border:1px solid}
    .light-theme .hist-item{background:var(--sur-l);border-color:var(--brd-l)}
    .dark-theme  .hist-item{background:var(--sur-d);border-color:var(--brd-d)}
    .hist-item p{font-weight:600;margin:0 0 2px}
    .hist-item small{opacity:.65}
    .badge{padding:4px 10px;border-radius:20px;font-size:.78rem;font-weight:600;color:#fff}
    .badge-completed{background:var(--ok)} .badge-pending{background:var(--wait)} .badge-rejected{background:var(--err)}

    /* ── form ── */
    .form-block{padding:18px;border-radius:12px;margin-bottom:14px;border:1px solid;display:flex;flex-direction:column;gap:12px}
    .light-theme .form-block{background:var(--sur-l);border-color:var(--brd-l)}
    .dark-theme  .form-block{background:var(--sur-d);border-color:var(--brd-d)}
    .form-block h3{font-size:1rem;font-weight:700}
    .form-block label{font-size:.85rem;font-weight:500;display:block;margin-bottom:4px}
    .form-block input, .form-block select{width:100%;padding:11px 13px;border:1px solid;border-radius:8px;font-family:var(--ff);font-size:.9rem;background:transparent;color:inherit}
    .light-theme .form-block input, .light-theme .form-block select{border-color:var(--brd-l);background:var(--bg-l)}
    .dark-theme  .form-block input, .dark-theme  .form-block select{border-color:var(--brd-d);background:var(--bg-d);color:var(--txt-d)}
    .form-block input:focus, .form-block select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(231,76,60,.18)}
    .form-notice{font-size:.82rem;text-align:center;opacity:.75;line-height:1.4}

    /* ── referral card ── */
    .ref-card{padding:18px;border-radius:12px;margin-bottom:14px;border:1px solid}
    .light-theme .ref-card{background:var(--sur-l);border-color:var(--brd-l)}
    .dark-theme  .ref-card{background:var(--sur-d);border-color:var(--brd-d)}
    .ref-card h3{margin-bottom:6px;font-size:1rem;font-weight:700}
    .ref-card p{font-size:.85rem;opacity:.75;margin-bottom:10px}
    .ref-input{width:100%;padding:10px;text-align:center;border-radius:8px;border:1px dashed var(--primary);background:transparent;color:inherit;font-family:var(--ff);font-size:.85rem;margin-bottom:10px}

    /* ── popup ── */
    .popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:10000}
    .popup-box{padding:28px;border-radius:16px;text-align:center;max-width:86%;width:340px}
    .light-theme .popup-box{background:var(--sur-l)} .dark-theme .popup-box{background:var(--sur-d)}
    .popup-box h2{color:var(--primary);margin-bottom:12px}
    .popup-box p{margin-bottom:18px;opacity:.85}
    .popup-close{padding:10px 24px;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer;font-family:var(--ff);font-weight:600}
    .popup-spin .spinner{width:38px;height:38px;margin:0 auto 14px}

    /* ── bottom nav ── */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;display:flex;border-top:1px solid;z-index:1000}
    .light-theme .bottom-nav{background:var(--sur-l);border-top-color:var(--brd-l)}
    .dark-theme  .bottom-nav{background:var(--sur-d);border-top-color:var(--brd-d)}
    .nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:10px 0;font-family:var(--ff);font-size:.72rem;transition:color .2s;gap:3px}
    .light-theme .nav-btn{color:var(--txt2-l)} .dark-theme .nav-btn{color:var(--txt2-d)}
    .nav-btn i{font-size:1.4rem} .nav-btn.active{color:var(--primary)}
  </style>
</head>
<body>

<!-- Loader -->
<div id="app-loader">
  <div class="spinner"></div>
  <p id="load-pct">0%</p>
</div>

<!-- Popup -->
<div id="popup" class="popup-overlay">
  <div class="popup-box" id="popup-box"></div>
</div>

<div id="app" style="display:none">
  <header class="profile-header">
    <img id="user-photo" src="https://via.placeholder.com/80" alt="">
    <h1 id="user-name">Загрузка...</h1>
    <div id="user-balance-container">Основной баланс: <span id="user-balance">0,00</span> ₽</div>
  </header>

  <main>
    <!-- HOME -->
    <div id="home-page" class="page active">
      <div class="stats-grid">
        <div class="stat-card"><h3>Реклама сегодня</h3><p id="daily-ads">0 / 0</p></div>
        <div class="stat-card"><h3>Рефералы</h3><p id="ref-count">0</p></div>
        <div class="stat-card"><h3>Всего просмотров</h3><p id="total-ads">0</p></div>
        <div class="stat-card"><h3>Общий доход</h3><p id="total-earned">0,00 ₽</p></div>
      </div>
      <div class="chart-container">
        <h3>Доход за 7 дней</h3>
        <div id="earnings-chart" class="chart"></div>
        <div id="earnings-labels" class="chart-labels"></div>
      </div>
      <div id="links-container" style="margin-top:18px"></div>
    </div>

    <!-- TASKS -->
    <div id="tasks-page" class="page">
      <div class="earning-wallet-card">
        <h3>Кошелёк заработка</h3>
        <div class="big-amt"><span id="ew-balance">0,00</span> ₽</div>
        <small>Минимум 100 ₽ для перевода на основной баланс.</small>
        <button id="move-btn" class="action-btn wide" disabled>Перевести на основной баланс</button>
      </div>
      <div id="ad-progress"></div>
      <div id="ad-task"></div>
      <div class="section-title">Бонусные задания</div>
      <div id="bonus-tasks"></div>
    </div>

    <!-- LEADERBOARD -->
    <div id="leaderboard-page" class="page">
      <div class="section-title" style="margin-top:4px">Рейтинг</div>
      <div class="lb-toggle">
        <button class="lb-btn active" data-board="referral">Топ рефереров</button>
        <button class="lb-btn" data-board="earning">Топ заработка</button>
      </div>
      <div id="lb-referral"><ul class="lb-list" id="lb-ref-list"></ul></div>
      <div id="lb-earning" style="display:none"><ul class="lb-list" id="lb-earn-list"></ul></div>
    </div>

    <!-- PROFILE -->
    <div id="profile-page" class="page">
      <div id="ref-section"></div>
      <div id="withdraw-section"></div>
      <div class="section-title">История выводов</div>
      <div id="history-list"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="home-page"><i class="fas fa-home"></i><span>Главная</span></button>
    <button class="nav-btn" data-page="tasks-page"><i class="fas fa-tasks"></i><span>Задания</span></button>
    <button class="nav-btn" data-page="leaderboard-page"><i class="fas fa-trophy"></i><span>Рейтинг</span></button>
    <button class="nav-btn" data-page="profile-page"><i class="fas fa-user-alt"></i><span>Профиль</span></button>
  </nav>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  document.body.className = `${tg.colorScheme}-theme`;

  let tgUser = tg.initDataUnsafe?.user || { id: 0, first_name: 'Гость' };
  let appCfg = {}, userState = {}, leaderboard = { referral:[], earning:[] }, userHistory = [];
  const BASE = '';   // same origin

  // ── helpers ──────────────────────────────────────────────
  const fmt = n => Number(n||0).toFixed(2).replace('.',',');
  const pct = n => document.getElementById('load-pct').textContent = n+'%';

  const popup = document.getElementById('popup');
  const popupBox = document.getElementById('popup-box');
  const showPopup = html => { popupBox.innerHTML = html; popup.style.display='flex'; };
  const closePopup = () => { popup.style.display='none'; };
  popup.addEventListener('click', e => {
    if (e.target === popup || e.target.classList.contains('popup-close')) closePopup();
  });

  const api = async (method, path, body) => {
    const opts = { method: method||'GET', headers:{'Content-Type':'application/json'} };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(BASE+path, opts);
    return r.json();
  };

  const loadAdSdk = id => {
    if (!id || document.querySelector(`script[data-zone='${id}']`)) return;
    const s = document.createElement('script');
    s.src = '//libtl.com/sdk.js';
    s.setAttribute('data-zone', id);
    s.setAttribute('data-sdk', `show_${id}`);
    s.async = true;
    document.body.appendChild(s);
  };

  // ── init ─────────────────────────────────────────────────
  const initApp = async () => {
    try {
      pct(10);
      appCfg = await api('GET', '/api/config');
      pct(30);

      const startParam = tg.initDataUnsafe?.start_param;
      const refId = (startParam && !isNaN(startParam)) ? startParam : null;
      userState = await api('POST', '/api/user/init', { user: tgUser, referralId: refId });
      pct(55);

      [leaderboard] = await Promise.all([
        api('GET', '/api/leaderboard'),
        loadEarningsChart(),
        loadHistory(),
      ]);
      pct(85);

      loadAdSdk(appCfg.adZoneId);
      renderUI();
      setupNav();
      setupEvents();
      pct(100);

      setTimeout(() => {
        document.getElementById('app-loader').style.display='none';
        document.getElementById('app').style.display='block';
        if (appCfg.welcomeMessage && !userState.welcomed) {
          showPopup(`<h2>Добро пожаловать!</h2><p>${appCfg.welcomeMessage}</p><button class="popup-close">Продолжить</button>`);
          api('POST', '/api/user/welcomed', { userId: tgUser.id });
        }
      }, 280);
    } catch(e) {
      console.error(e);
      tg.showAlert('Ошибка загрузки. Попробуйте снова.');
    }
  };

  const loadHistory = async () => {
    userHistory = await api('GET', `/api/user/history?userId=${tgUser.id}`);
    userHistory.sort((a,b) => b.created_at - a.created_at);
  };

  // ── render UI ─────────────────────────────────────────────
  const renderUI = () => {
    document.getElementById('user-photo').src = userState.photo_url || 'https://via.placeholder.com/80';
    document.getElementById('user-name').textContent = `${userState.first_name||''} ${userState.last_name||''}`.trim();
    document.getElementById('user-balance').textContent = fmt(userState.balance);
    document.getElementById('daily-ads').textContent = `${userState.daily_ad_count||0} / ${appCfg.dailyAdLimit||0}`;
    document.getElementById('ref-count').textContent = userState.referrals||0;
    document.getElementById('total-ads').textContent = userState.lifetime_ad_count||0;
    document.getElementById('total-earned').textContent = fmt(userState.total_earned)+' ₽';
    document.getElementById('ew-balance').textContent = fmt(userState.earning_wallet);
    document.getElementById('move-btn').disabled = (userState.earning_wallet||0) < 100;
    renderAdProgress(); renderAdTask(); renderBonusTasks();
    renderRefSection(); renderWithdrawSection(); renderLinks();
  };

  const renderAdProgress = () => {
    const lim = appCfg.dailyAdLimit||1, w = (userState.daily_ad_count||0)/lim*100;
    document.getElementById('ad-progress').innerHTML =
      `<div class="progress-wrap"><div class="prog-info"><span>Прогресс рекламы</span><span>${userState.daily_ad_count||0}/${lim}</span></div><div class="prog-bg"><div class="prog-fg" style="width:${w}%"></div></div></div>`;
  };

  const renderAdTask = () => {
    const now = Date.now(), onBreak = userState.break_until && now < userState.break_until;
    const limitHit = (userState.daily_ad_count||0) >= (appCfg.dailyAdLimit||0);
    let html='';
    if (onBreak) {
      const mins = Math.ceil((userState.break_until - now)/60000);
      html = card('https://img.icons8.com/ios-filled/100/hourglass.png','Перерыв!',
        `Подождите ещё ${mins} мин.`,'Ждём','',true);
    } else if (limitHit) {
      html = card('https://img.icons8.com/ios-filled/100/stop-circled.png','Лимит исчерпан',
        'Приходите завтра за новой рекламой.','Лимит','',true);
    } else {
      html = card('https://img.icons8.com/ios-filled/100/play-button-circled.png','Посмотреть рекламу',
        `Получите ${fmt(appCfg.adValue)} ₽ за каждый просмотр.`,'Смотреть','watch-ad-btn',false);
    }
    document.getElementById('ad-task').innerHTML = html;
    if (!onBreak && !limitHit)
      document.getElementById('watch-ad-btn')?.addEventListener('click', handleWatchAd);
  };

  const card = (icon, title, desc, btnTxt, btnId, disabled) =>
    `<div class="task-card"><img class="task-icon" src="${icon}" alt="">
     <div class="task-info"><h3>${title}</h3><p>${desc}</p></div>
     <button class="action-btn"${btnId?' id="'+btnId+'"':''}${disabled?' disabled':''}>
       ${btnTxt}</button></div>`;

  const renderBonusTasks = () => {
    const c = document.getElementById('bonus-tasks'); c.innerHTML='';
    if (!appCfg.tasks) return;
    const tasks = Object.entries(appCfg.tasks).reverse();
    tasks.forEach(([key, t]) => {
      const done = userState.completedTasks?.[key];
      const el = document.createElement('div'); el.className='task-card';
      el.innerHTML=`<img class="task-icon" src="${t.icon}" alt="">
        <div class="task-info"><h3>${t.name}</h3><p>Получите ${fmt(t.reward)} ₽</p></div>
        <button class="action-btn" data-task="${key}" data-url="${t.url}" ${done?'disabled':''}>${done?'Получено':'Забрать'}</button>`;
      c.appendChild(el);
    });
  };

  const renderLinks = () => {
    const c = document.getElementById('links-container'); c.innerHTML='';
    if (!appCfg.links) return;
    Object.entries(appCfg.links).reverse().forEach(([,l]) => {
      const el=document.createElement('div'); el.className='task-card';
      el.innerHTML=`<img class="task-icon" src="${l.icon}" alt="">
        <div class="task-info"><h3>${l.name}</h3></div>
        <button class="action-btn" onclick="tg.openLink('${l.url}')">Открыть</button>`;
      document.getElementById('links-container').appendChild(el);
    });
  };

  const renderRefSection = () => {
    const link = `https://t.me/${appCfg.botUsername}/app?startapp=${tgUser.id}`;
    document.getElementById('ref-section').innerHTML =
      `<div class="ref-card"><h3>Пригласи и зарабатывай!</h3>
       <p>Получайте ${fmt(appCfg.referralBonus)} ₽ за каждого реферала.</p>
       <input id="ref-link" class="ref-input" value="${link}" readonly>
       <button id="copy-ref" class="action-btn wide">Скопировать ссылку</button></div>`;
  };

  const renderWithdrawSection = () => {
    let opts='';
    (appCfg.withdrawMethods||[]).forEach(m => { opts+=`<option value="${m.name}">${m.name} (Мин: ${m.min} ₽)</option>`; });
    const minRefs = appCfg.minimumWithdrawReferrals||0;
    const notice = minRefs>0 ? `<p class="form-notice">⚠️ Для вывода нужно минимум <b>${minRefs} рефералов</b> (у вас: ${userState.referrals||0})</p>` : '';
    document.getElementById('withdraw-section').innerHTML=
      `<form id="wd-form" class="form-block"><h3>Запрос на вывод</h3>${notice}
       <div><label>Способ вывода</label><select id="wd-method">${opts}</select></div>
       <div><label>Номер счёта / ID</label><input type="text" id="wd-acct" required></div>
       <div><label>Сумма (₽)</label><input type="number" step="any" id="wd-amount" required></div>
       <button type="submit" id="wd-btn" class="action-btn wide">Отправить заявку</button></form>`;
  };

  const renderLeaderboard = () => {
    const board = document.querySelector('.lb-btn.active').dataset.board;
    document.getElementById('lb-referral').style.display = board==='referral'?'block':'none';
    document.getElementById('lb-earning').style.display  = board==='earning'?'block':'none';
    const listId = board==='referral'?'lb-ref-list':'lb-earn-list';
    const items  = leaderboard[board]||[];
    const el     = document.getElementById(listId);
    if (!items.length){el.innerHTML='<li style="opacity:.6;padding:10px">Нет данных</li>';return;}
    el.innerHTML = items.map((u,i)=>{
      const score = board==='referral' ? (u.referrals||0) : fmt(u.total_earned)+' ₽';
      return `<li class="lb-item">
        <span class="lb-rank">#${i+1}</span>
        <img src="${u.photo_url||'https://via.placeholder.com/38'}" alt="">
        <span class="lb-name">${u.first_name||'—'}</span>
        <span class="lb-score">${score}</span></li>`;
    }).join('');
  };

  const renderHistory = () => {
    const el = document.getElementById('history-list');
    const statusMap = { pending:'badge-pending', completed:'badge-completed', rejected:'badge-rejected' };
    const statusRu  = { pending:'Ожидает', completed:'Выполнен', rejected:'Отклонён' };
    if (!userHistory.length) { el.innerHTML='<p style="opacity:.6;padding:10px">История пуста.</p>'; return; }
    el.innerHTML = userHistory.map(h=>
      `<div class="hist-item">
        <div><p>${fmt(h.amount)} ₽ — ${h.method}</p><small>${new Date(h.created_at).toLocaleString('ru-RU')}</small></div>
        <span class="badge ${statusMap[h.status]||''}">${statusRu[h.status]||h.status}</span>
      </div>`).join('');
  };

  const loadEarningsChart = async () => {
    const data = await api('GET', `/api/user/earnings?userId=${tgUser.id}`);
    const chart = document.getElementById('earnings-chart');
    const labels = document.getElementById('earnings-labels');
    chart.innerHTML=''; labels.innerHTML='';
    const maxV = Math.max(...data.earnings, 1);
    data.earnings.forEach((v,i) => {
      const h = Math.max((v/maxV)*100, 1);
      const day = new Date(data.dates[i]).toLocaleDateString('ru-RU',{day:'numeric'});
      chart.innerHTML  += `<div class="bar" style="height:${h}%"><span class="tip">${fmt(v)} ₽</span></div>`;
      labels.innerHTML += `<span>${day}</span>`;
    });
  };

  // ── event handlers ────────────────────────────────────────
  const handleWatchAd = async () => {
    const now = Date.now();
    if ((userState.daily_ad_count||0) >= (appCfg.dailyAdLimit||0)) {
      tg.showAlert('Дневной лимит исчерпан.'); return;
    }
    if (userState.break_until && now < userState.break_until) {
      tg.showAlert(`Подождите ещё ${Math.ceil((userState.break_until-now)/60000)} мин.`); return;
    }
    const fn = window[`show_${appCfg.adZoneId}`];
    if (typeof fn !== 'function') { tg.showAlert('Рекламная сеть не готова. Попробуйте чуть позже.'); return; }

    showPopup(`<div class="popup-spin"><div class="spinner"></div></div><h2>Загрузка рекламы</h2><p>Подождите...</p>`);
    try {
      await fn();
      closePopup();
      userState = await api('POST', '/api/user/watch-ad', { userId: tgUser.id });
      tg.HapticFeedback.notificationOccurred('success');
      tg.showAlert(`+${fmt(appCfg.adValue)} ₽ добавлено в кошелёк заработка.`);
      renderUI();
    } catch(e) {
      closePopup(); tg.showAlert('Не удалось загрузить рекламу. Попробуйте снова.');
    }
  };

  const handleMoveBalance = async () => {
    if ((userState.earning_wallet||0) < 100) { tg.showAlert('Нужно минимум 100 ₽.'); return; }
    const btn = document.getElementById('move-btn');
    btn.disabled=true; btn.textContent='Переводим...';
    try {
      userState = await api('POST', '/api/user/move-balance', { userId: tgUser.id });
      tg.HapticFeedback.notificationOccurred('success');
      tg.showAlert('Успешно переведено на основной баланс!');
    } catch(e) { tg.showAlert('Ошибка. Попробуйте снова.'); }
    finally { btn.textContent='Перевести на основной баланс'; renderUI(); }
  };

  const handleWithdraw = async e => {
    e.preventDefault();
    const minR = appCfg.minimumWithdrawReferrals||0;
    if (minR>0 && (userState.referrals||0)<minR) {
      tg.showAlert(`Нужно минимум ${minR} рефералов (у вас ${userState.referrals||0}).`); return;
    }
    const method = document.getElementById('wd-method').value;
    const account = document.getElementById('wd-acct').value;
    const amount = parseFloat(document.getElementById('wd-amount').value);
    const sel = (appCfg.withdrawMethods||[]).find(m=>m.name===method);
    if (!sel) { tg.showAlert('Недопустимый способ вывода.'); return; }
    if (isNaN(amount)||amount<=0) { tg.showAlert('Введите корректную сумму.'); return; }
    if (amount<sel.min) { tg.showAlert(`Минимальная сумма для ${sel.name}: ${sel.min} ₽`); return; }
    if (amount>(userState.balance||0)) { tg.showAlert('Недостаточно средств на основном балансе.'); return; }

    const btn=document.getElementById('wd-btn'); btn.disabled=true; btn.textContent='Отправляем...';
    try {
      const res = await api('POST','/api/user/withdraw',{userId:tgUser.id,method,account,amount});
      if (res.error) { tg.showAlert(res.error); return; }
      userState.balance = (userState.balance||0) - amount;
      userHistory.unshift(res.withdrawal);
      tg.HapticFeedback.notificationOccurred('success');
      tg.showAlert('Заявка на вывод успешно отправлена!');
      document.getElementById('wd-form').reset();
      renderHistory();
    } catch(e) { tg.showAlert('Ошибка отправки. Попробуйте снова.'); }
    finally { btn.disabled=false; btn.textContent='Отправить заявку'; renderUI(); }
  };

  const handleClaimTask = async e => {
    const btn = e.target.closest('button[data-task]');
    if (!btn || btn.disabled) return;
    const taskId = btn.dataset.task, taskUrl = btn.dataset.url;
    tg.openLink(taskUrl);
    btn.disabled=true; btn.textContent='Получаем...';
    setTimeout(async()=>{
      try {
        const r = await api('POST','/api/task/claim',{userId:tgUser.id,taskId});
        if (r.error){btn.disabled=false;btn.textContent='Забрать';tg.showAlert(r.error);return;}
        if (!userState.completedTasks) userState.completedTasks={};
        userState.completedTasks[taskId]=true;
        userState.balance=(userState.balance||0)+r.reward;
        tg.HapticFeedback.notificationOccurred('success');
        tg.showAlert(`Получено ${fmt(r.reward)} ₽!`);
        renderUI();
      } catch(e){btn.disabled=false;btn.textContent='Забрать';}
    }, 5000);
  };

  const copyRef = () => {
    const inp = document.getElementById('ref-link'); inp.select();
    navigator.clipboard.writeText(inp.value).then(()=>{
      tg.HapticFeedback.notificationOccurred('success');
      tg.showAlert('Реферальная ссылка скопирована!');
    }).catch(()=>{ document.execCommand('copy'); tg.showAlert('Скопировано!'); });
  };

  // ── navigation ────────────────────────────────────────────
  const setupNav = () => {
    document.querySelectorAll('.nav-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const pg = btn.dataset.page;
        document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
        document.getElementById(pg).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        if (pg==='profile-page')    renderHistory();
        if (pg==='leaderboard-page') renderLeaderboard();
      });
    });
  };

  const setupEvents = () => {
    document.getElementById('move-btn').addEventListener('click', handleMoveBalance);
    document.getElementById('bonus-tasks').addEventListener('click', handleClaimTask);
    document.getElementById('profile-page').addEventListener('submit', e=>{
      if (e.target.id==='wd-form') handleWithdraw(e);
    });
    document.getElementById('ref-section').addEventListener('click', e=>{
      if (e.target.id==='copy-ref') copyRef();
    });
    document.querySelector('.lb-toggle').addEventListener('click', e=>{
      const btn = e.target.closest('.lb-btn'); if(!btn) return;
      document.querySelectorAll('.lb-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderLeaderboard();
    });
  };

  initApp();
});
</script>
</body>
</html>
