<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PaidAdz 💎</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
    :root {
      /* Premium color palette */
      --c1: #0A0A0F;
      --c2: #12121A;
      --c3: #1A1A2E;
      --c4: #16213E;
      --accent: #7C3AED;
      --accent2: #06B6D4;
      --accent3: #F59E0B;
      --glow1: rgba(124,58,237,0.4);
      --glow2: rgba(6,182,212,0.3);
      --glow3: rgba(245,158,11,0.3);
      --txt: #F0F0FF;
      --txt2: #8B8BA7;
      --txt3: #5A5A78;
      --surface: rgba(255,255,255,0.04);
      --surface2: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border2: rgba(124,58,237,0.3);
      --grad: linear-gradient(135deg, #7C3AED, #06B6D4);
      --grad2: linear-gradient(135deg, #F59E0B, #EF4444);
      --grad3: linear-gradient(135deg, #06B6D4, #7C3AED);
      --ff-head: 'Syne', sans-serif;
      --ff-body: 'DM Sans', sans-serif;
      --nav-h: 72px;
      --radius: 20px;
      --radius-sm: 12px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--ff-body);
      background: var(--c1);
      color: var(--txt);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NOISE TEXTURE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* ── ANIMATED BACKGROUND ORBS ── */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: drift 20s ease-in-out infinite;
    }
    .orb-1 { width: 320px; height: 320px; background: var(--glow1); top: -80px; left: -80px; animation-delay: 0s; }
    .orb-2 { width: 280px; height: 280px; background: var(--glow2); bottom: 100px; right: -60px; animation-delay: -7s; }
    .orb-3 { width: 200px; height: 200px; background: var(--glow3); top: 50%; left: 50%; animation-delay: -14s; }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.1); }
      66% { transform: translate(-30px, 40px) scale(0.9); }
    }

    /* ── APP LAYOUT ── */
    #app { max-width: 500px; margin: 0 auto; padding-bottom: calc(var(--nav-h) + 12px); position: relative; z-index: 1; }
    .page { display: none; padding: 0 16px 16px; animation: pageIn 0.4s cubic-bezier(0.22,1,0.36,1) forwards; }
    .page.active { display: block; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── LOADER ── */
    #app-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
      background: var(--c1);
    }
    .loader-logo { font-family: var(--ff-head); font-size: 2rem; font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.5px; }
    .loader-ring {
      width: 56px; height: 56px; position: relative;
    }
    .loader-ring::before, .loader-ring::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent;
    }
    .loader-ring::before { border-top-color: var(--accent); animation: spin 1s linear infinite; }
    .loader-ring::after { border-bottom-color: var(--accent2); animation: spin 1.5s linear infinite reverse; inset: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #load-pct { font-family: var(--ff-head); font-size: 0.9rem; font-weight: 600; color: var(--txt2); letter-spacing: 2px; }
    .loader-bar-wrap { width: 160px; height: 2px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
    .loader-bar { height: 100%; background: var(--grad); border-radius: 99px; transition: width 0.3s ease; width: 0%; }

    /* ── PROFILE HEADER ── */
    .profile-header {
      padding: 28px 16px 20px;
      position: relative;
      overflow: hidden;
    }
    .profile-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 100%;
      background: linear-gradient(180deg, rgba(124,58,237,0.12) 0%, transparent 100%);
      pointer-events: none;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .brand-name { font-family: var(--ff-head); font-size: 1.3rem; font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .theme-toggle { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--txt2); font-size: 0.9rem; transition: all 0.2s; }
    .theme-toggle:hover { border-color: var(--border2); color: var(--accent); }

    .user-row { display: flex; align-items: center; gap: 14px; }
    .avatar-wrap { position: relative; flex-shrink: 0; }
    #user-photo {
      width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
      border: 2px solid transparent;
      background-clip: padding-box;
      box-shadow: 0 0 0 2px var(--accent), 0 8px 24px var(--glow1);
    }
    .avatar-badge {
      position: absolute; bottom: 0; right: 0;
      width: 18px; height: 18px; border-radius: 50%;
      background: linear-gradient(135deg, #22C55E, #16A34A);
      border: 2px solid var(--c1);
    }
    #user-name { font-family: var(--ff-head); font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
    #user-balance-container { font-size: 0.82rem; color: var(--txt2); }
    .balance-val { font-size: 1.3rem; font-weight: 700; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; display: inline-block; }

    /* ── GLASS CARD ── */
    .glass {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .glass-hover { transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s; }
    .glass-hover:hover { border-color: var(--border2); box-shadow: 0 8px 32px var(--glow1); transform: translateY(-1px); }

    /* ── STATS GRID ── */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 0; }
    .stat-card {
      padding: 16px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: all 0.25s;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: var(--grad);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .stat-card:hover::before { opacity: 1; }
    .stat-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .stat-label { font-size: 0.72rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--txt3); margin-bottom: 8px; }
    .stat-val { font-family: var(--ff-head); font-size: 1.45rem; font-weight: 700; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-icon { position: absolute; right: 12px; top: 12px; font-size: 1.1rem; opacity: 0.15; }

    /* ── CHART ── */
    .chart-wrap {
      margin: 10px 0;
      padding: 20px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .chart-head h3 { font-family: var(--ff-head); font-size: 1rem; font-weight: 700; }
    .chart-badge { font-size: 0.72rem; padding: 4px 10px; border-radius: 99px; background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.3); color: var(--accent); font-weight: 600; }
    .chart { display: flex; justify-content: space-around; align-items: flex-end; height: 110px; padding-top: 10px; gap: 4px; }
    .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .bar {
      width: 100%; border-radius: 6px 6px 0 0;
      background: linear-gradient(to top, var(--accent), var(--accent2));
      min-height: 3px;
      position: relative;
      cursor: pointer;
      transition: filter 0.2s, transform 0.2s;
    }
    .bar:hover { filter: brightness(1.3); transform: scaleX(1.05); }
    .bar .tip {
      position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
      background: var(--c3); color: var(--txt); padding: 3px 8px; border-radius: 6px;
      font-size: 0.7rem; font-weight: 600; white-space: nowrap; opacity: 0;
      transition: opacity 0.2s; pointer-events: none; border: 1px solid var(--border2);
    }
    .bar:hover .tip { opacity: 1; }
    .bar-label { font-size: 0.65rem; color: var(--txt3); font-weight: 500; }

    /* ── SECTION TITLE ── */
    .section-title {
      font-family: var(--ff-head); font-size: 0.85rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 2px; color: var(--txt3);
      margin: 22px 0 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── TASK CARDS ── */
    .task-card {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 10px;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }
    .task-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
      background: var(--grad); opacity: 0; transition: opacity 0.25s;
    }
    .task-card:hover { border-color: var(--border2); transform: translateX(2px); box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
    .task-card:hover::before { opacity: 1; }
    .task-icon {
      width: 44px; height: 44px; border-radius: 12px;
      object-fit: cover; flex-shrink: 0;
      background: var(--surface2);
    }
    .task-icon-svg {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      font-size: 1.3rem;
    }
    .task-info { flex: 1; min-width: 0; }
    .task-info h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 3px; font-family: var(--ff-head); }
    .task-info p { font-size: 0.78rem; color: var(--txt2); }

    /* ── BUTTONS ── */
    .btn {
      padding: 10px 18px; border: none; border-radius: 10px;
      font-family: var(--ff-body); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.25s; white-space: nowrap;
      position: relative; overflow: hidden;
    }
    .btn::after {
      content: ''; position: absolute; inset: 0;
      background: white; opacity: 0; transition: opacity 0.2s;
    }
    .btn:hover::after { opacity: 0.08; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 4px 16px var(--glow1); margin-left: auto; flex-shrink: 0; }
    .btn-primary:hover { box-shadow: 0 8px 24px var(--glow1); }
    .btn-primary:disabled { background: var(--surface2); box-shadow: none; cursor: not-allowed; color: var(--txt3); }
    .btn-wide { width: 100%; margin-top: 12px; padding: 14px; font-size: 0.95rem; border-radius: var(--radius-sm); }
    .btn-ghost { background: var(--surface2); color: var(--txt); border: 1px solid var(--border); margin-left: auto; flex-shrink: 0; }

    /* ── EARNING WALLET CARD ── */
    .ew-card {
      padding: 22px;
      border-radius: var(--radius);
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(6,182,212,0.15));
      border: 1px solid rgba(124,58,237,0.3);
    }
    .ew-card::before {
      content: '';
      position: absolute; top: -50%; right: -20%;
      width: 200px; height: 200px;
      background: radial-gradient(circle, var(--glow2), transparent 70%);
      pointer-events: none;
    }
    .ew-label { font-size: 0.78rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent2); margin-bottom: 8px; }
    .ew-amount { font-family: var(--ff-head); font-size: 2.4rem; font-weight: 800; line-height: 1; margin-bottom: 4px; background: var(--grad3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .ew-note { font-size: 0.78rem; color: var(--txt2); margin-bottom: 0; }

    /* ── PROGRESS ── */
    .progress-wrap { margin: 14px 0; padding: 16px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); }
    .prog-info { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 600; margin-bottom: 10px; }
    .prog-info span:last-child { color: var(--accent); }
    .prog-bg { width: 100%; height: 6px; border-radius: 99px; background: var(--surface2); overflow: hidden; position: relative; }
    .prog-fg { height: 100%; border-radius: 99px; background: var(--grad); transition: width 0.6s cubic-bezier(0.4,0,0.2,1); position: relative; }
    .prog-fg::after { content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px var(--accent); }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      max-width: 500px; margin: 0 auto;
      display: flex; justify-content: space-around;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      z-index: 1000;
      padding: 8px 0 env(safe-area-inset-bottom, 8px);
      height: var(--nav-h);
    }
    .nav-btn {
      flex: 1; background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; font-family: var(--ff-body); font-size: 0.65rem; font-weight: 500;
      color: var(--txt3); transition: color 0.25s; padding: 8px 0;
      position: relative;
    }
    .nav-btn i { font-size: 1.25rem; transition: transform 0.25s; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn.active i { transform: translateY(-2px); }
    .nav-btn.active::before {
      content: ''; position: absolute; top: 0; left: 25%; right: 25%;
      height: 2px; background: var(--grad); border-radius: 0 0 4px 4px;
    }
    .nav-pip { position: absolute; top: 6px; right: 22%; width: 5px; height: 5px; border-radius: 50%; background: var(--accent3); display: none; }

    /* ── LEADERBOARD ── */
    .lb-toggle {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .lb-btn {
      flex: 1; padding: 11px 10px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface);
      font-family: var(--ff-body); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; color: var(--txt2); transition: all 0.25s;
    }
    .lb-btn.active {
      background: rgba(124,58,237,0.2); border-color: var(--border2);
      color: var(--accent);
    }
    .lb-list { list-style: none; }
    .lb-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border);
      margin-bottom: 8px; transition: all 0.2s;
    }
    .lb-item:hover { border-color: var(--border2); }
    .lb-rank { font-family: var(--ff-head); font-size: 1.1rem; font-weight: 800; width: 28px; flex-shrink: 0; }
    .lb-rank.gold { background: linear-gradient(135deg, #F59E0B, #FBBF24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .lb-rank.silver { background: linear-gradient(135deg, #9CA3AF, #D1D5DB); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .lb-rank.bronze { background: linear-gradient(135deg, #B45309, #D97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .lb-item img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border2); }
    .lb-name { flex: 1; font-weight: 600; font-size: 0.9rem; }
    .lb-score { font-family: var(--ff-head); font-weight: 700; font-size: 0.95rem; color: var(--accent); }

    /* ── HISTORY ── */
    .hist-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .hist-item p { font-weight: 600; font-size: 0.92rem; font-family: var(--ff-head); }
    .hist-item small { color: var(--txt3); font-size: 0.75rem; display: block; margin-top: 2px; }
    .badge { padding: 5px 12px; border-radius: 99px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; }
    .badge-completed { background: rgba(34,197,94,0.15); color: #22C55E; border: 1px solid rgba(34,197,94,0.25); }
    .badge-pending { background: rgba(245,158,11,0.15); color: #F59E0B; border: 1px solid rgba(245,158,11,0.25); }
    .badge-rejected { background: rgba(239,68,68,0.15); color: #EF4444; border: 1px solid rgba(239,68,68,0.25); }

    /* ── FORM ── */
    .form-block {
      padding: 20px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--border);
      margin-bottom: 14px; display: flex; flex-direction: column; gap: 14px;
    }
    .form-block h3 { font-family: var(--ff-head); font-size: 1.05rem; font-weight: 700; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--txt2); display: block; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--txt); font-family: var(--ff-body); font-size: 0.9rem;
      transition: border-color 0.25s, box-shadow 0.25s; outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--border2);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
    }
    .form-group select option { background: var(--c2); }
    .form-notice {
      font-size: 0.8rem; text-align: center; color: var(--txt2);
      padding: 10px; border-radius: 8px;
      background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2);
    }

    /* ── REFERRAL ── */
    .ref-card {
      padding: 20px; border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(124,58,237,0.12), rgba(6,182,212,0.08));
      border: 1px solid rgba(124,58,237,0.2);
      margin-bottom: 14px; position: relative; overflow: hidden;
    }
    .ref-card h3 { font-family: var(--ff-head); font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
    .ref-card p { font-size: 0.82rem; color: var(--txt2); margin-bottom: 12px; }
    .ref-input-wrap { display: flex; gap: 8px; align-items: center; }
    .ref-input {
      flex: 1; padding: 11px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--border2); background: rgba(124,58,237,0.08);
      color: var(--txt); font-family: var(--ff-body); font-size: 0.82rem; outline: none;
    }

    /* ── POPUP ── */
    .popup-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; justify-content: center; align-items: center; z-index: 10000;
      backdrop-filter: blur(6px);
    }
    .popup-box {
      padding: 32px 28px; border-radius: 24px; text-align: center;
      max-width: 90%; width: 340px;
      background: var(--c2); border: 1px solid var(--border2);
      box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 40px var(--glow1);
      animation: popIn 0.35s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes popIn { from { opacity: 0; transform: scale(0.88) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .popup-box h2 { font-family: var(--ff-head); font-size: 1.3rem; font-weight: 800; margin-bottom: 10px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .popup-box p { font-size: 0.9rem; color: var(--txt2); margin-bottom: 20px; line-height: 1.6; }
    .popup-close { padding: 12px 28px; border: none; border-radius: var(--radius-sm); background: var(--grad); color: #fff; cursor: pointer; font-family: var(--ff-body); font-weight: 700; font-size: 0.9rem; box-shadow: 0 4px 16px var(--glow1); }
    .popup-spin .loader-ring { margin: 0 auto 14px; }

    /* ── LIGHT THEME ── */
    body.light-theme {
      --c1: #F8F9FC;
      --c2: #FFFFFF;
      --c3: #EEF0F8;
      --c4: #E4E7F5;
      --surface: rgba(255,255,255,0.8);
      --surface2: rgba(0,0,0,0.04);
      --border: rgba(0,0,0,0.09);
      --border2: rgba(124,58,237,0.35);
      --txt: #0F0F1A;
      --txt2: #6B6B8A;
      --txt3: #9494B0;
      --glow1: rgba(124,58,237,0.2);
      --glow2: rgba(6,182,212,0.15);
    }
    body.light-theme .bottom-nav { background: rgba(248,249,252,0.9); }
    body.light-theme .popup-box { background: #fff; }
    body.light-theme .orb { opacity: 0.5; }

    /* ── LINK CARDS ── */
    #links-container { margin-top: 10px; }

    /* ── UTIL ── */
    .mt-8 { margin-top: 8px; }
    .hidden { display: none !important; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
  </style>
</head>
<body class="dark-theme">

<!-- Ambient Background -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- Loader -->
<div id="app-loader">
  <div class="loader-logo">PaidAdz</div>
  <div class="loader-ring"></div>
  <div class="loader-bar-wrap"><div class="loader-bar" id="loader-bar"></div></div>
  <p id="load-pct">LOADING...</p>
</div>

<!-- Popup -->
<div id="popup" class="popup-overlay">
  <div class="popup-box" id="popup-box"></div>
</div>

<div id="app" style="display:none">
  <!-- Header -->
  <header class="profile-header">
    <div class="header-top">
      <span class="brand-name">PaidAdz 💎</span>
      <button class="theme-toggle" id="theme-toggle"><i class="fas fa-moon"></i></button>
    </div>
    <div class="user-row">
      <div class="avatar-wrap">
        <img id="user-photo" src="https://via.placeholder.com/64" alt="">
        <div class="avatar-badge"></div>
      </div>
      <div>
        <div id="user-name" style="font-family:var(--ff-head);font-size:1.1rem;font-weight:700;">Loading...</div>
        <div id="user-balance-container" style="font-size:0.8rem;color:var(--txt2);margin-top:2px;">
          Balance: <span class="balance-val" id="user-balance">0.00</span> ₽
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- HOME PAGE -->
    <div id="home-page" class="page active">
      <div class="stats-grid">
        <div class="stat-card glass-hover">
          <div class="stat-label">Today Ads</div>
          <div class="stat-val" id="daily-ads">0/0</div>
          <i class="fas fa-play-circle stat-icon"></i>
        </div>
        <div class="stat-card glass-hover">
          <div class="stat-label">Referrals</div>
          <div class="stat-val" id="ref-count">0</div>
          <i class="fas fa-users stat-icon"></i>
        </div>
        <div class="stat-card glass-hover">
          <div class="stat-label">Total Views</div>
          <div class="stat-val" id="total-ads">0</div>
          <i class="fas fa-eye stat-icon"></i>
        </div>
        <div class="stat-card glass-hover">
          <div class="stat-label">Total Earned</div>
          <div class="stat-val" id="total-earned">0.00₽</div>
          <i class="fas fa-wallet stat-icon"></i>
        </div>
      </div>

      <div class="chart-wrap mt-8">
        <div class="chart-head">
          <h3>Earnings</h3>
          <span class="chart-badge">7 Days</span>
        </div>
        <div id="earnings-chart" class="chart"></div>
      </div>

      <div class="section-title">Quick Links</div>
      <div id="links-container"></div>
    </div>

    <!-- TASKS PAGE -->
    <div id="tasks-page" class="page">
      <div class="ew-card">
        <div class="ew-label">Earning Wallet</div>
        <div class="ew-amount"><span id="ew-balance">0.00</span> ₽</div>
        <div class="ew-note">Minimum 100 ₽ to transfer</div>
        <button id="move-btn" class="btn btn-primary btn-wide" disabled>Transfer to Main Balance</button>
      </div>
      <div id="ad-progress"></div>
      <div class="section-title">Watch Ads</div>
      <div id="ad-task"></div>
      <div class="section-title">Bonus Tasks</div>
      <div id="bonus-tasks"></div>
    </div>

    <!-- LEADERBOARD PAGE -->
    <div id="leaderboard-page" class="page">
      <div class="section-title" style="margin-top:8px">Rankings</div>
      <div class="lb-toggle">
        <button class="lb-btn active" data-board="referral">🏆 Top Referrers</button>
        <button class="lb-btn" data-board="earning">💰 Top Earners</button>
      </div>
      <div id="lb-referral"><ul class="lb-list" id="lb-ref-list"></ul></div>
      <div id="lb-earning" style="display:none"><ul class="lb-list" id="lb-earn-list"></ul></div>
    </div>

    <!-- PROFILE PAGE -->
    <div id="profile-page" class="page">
      <div id="ref-section"></div>
      <div id="withdraw-section"></div>
      <div class="section-title">Withdrawal History</div>
      <div id="history-list"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="home-page">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-page="tasks-page">
      <i class="fas fa-bolt"></i>
      <span>Tasks</span>
      <div class="nav-pip" id="task-pip"></div>
    </button>
    <button class="nav-btn" data-page="leaderboard-page">
      <i class="fas fa-trophy"></i>
      <span>Ranks</span>
    </button>
    <button class="nav-btn" data-page="profile-page">
      <i class="fas fa-user"></i>
      <span>Profile</span>
    </button>
  </nav>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const tg = window.Telegram?.WebApp || { ready(){}, expand(){}, colorScheme:'dark', initDataUnsafe:{}, showAlert: alert, HapticFeedback:{notificationOccurred(){}}, openLink: url=>window.open(url,'_blank') };
  tg.ready(); tg.expand();

  // theme
  let isDark = (tg.colorScheme !== 'light');
  document.body.className = isDark ? 'dark-theme' : 'light-theme';

  document.getElementById('theme-toggle').addEventListener('click', () => {
    isDark = !isDark;
    document.body.className = isDark ? 'dark-theme' : 'light-theme';
    document.getElementById('theme-toggle').innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
  });

  let tgUser = tg.initDataUnsafe?.user || { id: 0, first_name: 'Guest' };
  let appCfg = {}, userState = {}, leaderboard = { referral:[], earning:[] }, userHistory = [];
  const BASE = '';

  const fmt = n => Number(n||0).toFixed(2).replace('.', ',');
  const setPct = n => {
    document.getElementById('load-pct').textContent = n + '%';
    document.getElementById('loader-bar').style.width = n + '%';
  };

  const popup = document.getElementById('popup');
  const popupBox = document.getElementById('popup-box');
  const showPopup = html => { popupBox.innerHTML = html; popup.style.display = 'flex'; };
  const closePopup = () => { popup.style.display = 'none'; };
  popup.addEventListener('click', e => {
    if (e.target === popup || e.target.classList.contains('popup-close')) closePopup();
  });

  const api = async (method, path, body) => {
    const opts = { method: method||'GET', headers: {'Content-Type':'application/json'} };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(BASE + path, opts);
    return r.json();
  };

  const loadAdSdk = id => {
    if (!id || document.querySelector(`script[data-zone='${id}']`)) return;
    const s = document.createElement('script');
    s.src = '//libtl.com/sdk.js';
    s.setAttribute('data-zone', id);
    s.setAttribute('data-sdk', `show_${id}`);
    s.async = true;
    document.body.appendChild(s);
  };

  // ── init ──
  const initApp = async () => {
    try {
      setPct(10);
      appCfg = await api('GET', '/api/config');
      setPct(30);

      const startParam = tg.initDataUnsafe?.start_param;
      const refId = (startParam && !isNaN(startParam)) ? startParam : null;
      userState = await api('POST', '/api/user/init', { user: tgUser, referralId: refId });
      setPct(55);

      [leaderboard] = await Promise.all([
        api('GET', '/api/leaderboard'),
        loadEarningsChart(),
        loadHistory(),
      ]);
      setPct(85);

      loadAdSdk(appCfg.adZoneId);
      renderUI();
      setupNav();
      setupEvents();
      setPct(100);

      setTimeout(() => {
        document.getElementById('app-loader').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        if (appCfg.welcomeMessage && !userState.welcomed) {
          showPopup(`<h2>Welcome! 🎉</h2><p>${appCfg.welcomeMessage}</p><button class="popup-close">Let's Go</button>`);
          api('POST', '/api/user/welcomed', { userId: tgUser.id });
        }
      }, 300);
    } catch(e) {
      console.error(e);
      tg.showAlert('Failed to load. Please try again.');
    }
  };

  const loadHistory = async () => {
    userHistory = await api('GET', `/api/user/history?userId=${tgUser.id}`);
    userHistory.sort((a,b) => b.created_at - a.created_at);
  };

  // ── render ──
  const renderUI = () => {
    document.getElementById('user-photo').src = userState.photo_url || 'https://via.placeholder.com/64';
    document.getElementById('user-name').textContent = `${userState.first_name||''} ${userState.last_name||''}`.trim();
    document.getElementById('user-balance').textContent = fmt(userState.balance);
    document.getElementById('daily-ads').textContent = `${userState.daily_ad_count||0}/${appCfg.dailyAdLimit||0}`;
    document.getElementById('ref-count').textContent = userState.referrals||0;
    document.getElementById('total-ads').textContent = userState.lifetime_ad_count||0;
    document.getElementById('total-earned').textContent = fmt(userState.total_earned)+'₽';
    document.getElementById('ew-balance').textContent = fmt(userState.earning_wallet);
    document.getElementById('move-btn').disabled = (userState.earning_wallet||0) < 100;

    // task pip indicator
    const pip = document.getElementById('task-pip');
    if ((userState.daily_ad_count||0) < (appCfg.dailyAdLimit||0)) pip.style.display = 'block';

    renderAdProgress(); renderAdTask(); renderBonusTasks();
    renderRefSection(); renderWithdrawSection(); renderLinks();
  };

  const renderAdProgress = () => {
    const lim = appCfg.dailyAdLimit || 1;
    const cur = userState.daily_ad_count || 0;
    const w = (cur / lim * 100).toFixed(1);
    document.getElementById('ad-progress').innerHTML = `
      <div class="progress-wrap">
        <div class="prog-info"><span>Ad Progress</span><span>${cur} / ${lim}</span></div>
        <div class="prog-bg"><div class="prog-fg" style="width:${w}%"></div></div>
      </div>`;
  };

  const getTaskIcon = key => {
    const icons = { watch: '▶️', play: '🎬', ad: '📺', bonus: '⭐', join: '📢', follow: '💬' };
    for (const k in icons) if (key.toLowerCase().includes(k)) return icons[k];
    return '🎯';
  };

  const renderAdTask = () => {
    const now = Date.now();
    const onBreak = userState.break_until && now < userState.break_until;
    const limitHit = (userState.daily_ad_count||0) >= (appCfg.dailyAdLimit||0);
    let html = '';

    if (onBreak) {
      const mins = Math.ceil((userState.break_until - now) / 60000);
      html = taskCard('⏳', 'On Break', `Wait ${mins} more min.`, 'Wait...', '', true);
    } else if (limitHit) {
      html = taskCard('🚫', 'Daily Limit Reached', 'Come back tomorrow.', 'Done', '', true);
    } else {
      html = taskCard('▶️', 'Watch Advertisement', `Earn ${fmt(appCfg.adValue)} ₽ per view`, 'Watch Now', 'watch-ad-btn', false);
    }
    document.getElementById('ad-task').innerHTML = html;
    if (!onBreak && !limitHit)
      document.getElementById('watch-ad-btn')?.addEventListener('click', handleWatchAd);
  };

  const taskCard = (icon, title, desc, btnTxt, btnId, disabled) => `
    <div class="task-card">
      <div class="task-icon-svg" style="background:rgba(124,58,237,0.12)">${icon}</div>
      <div class="task-info"><h3>${title}</h3><p>${desc}</p></div>
      <button class="btn btn-primary"${btnId ? ` id="${btnId}"` : ''}${disabled ? ' disabled' : ''}>${btnTxt}</button>
    </div>`;

  const renderBonusTasks = () => {
    const c = document.getElementById('bonus-tasks'); c.innerHTML = '';
    if (!appCfg.tasks) return;
    Object.entries(appCfg.tasks).reverse().forEach(([key, t]) => {
      const done = userState.completedTasks?.[key];
      const el = document.createElement('div'); el.className = 'task-card';
      el.innerHTML = `
        <img class="task-icon" src="${t.icon}" alt="" onerror="this.style.display='none'">
        <div class="task-info"><h3>${t.name}</h3><p>Earn ${fmt(t.reward)} ₽</p></div>
        <button class="btn ${done ? 'btn-ghost' : 'btn-primary'}" data-task="${key}" data-url="${t.url}" ${done ? 'disabled' : ''}>
          ${done ? '✓ Done' : 'Claim'}
        </button>`;
      c.appendChild(el);
    });
  };

  const renderLinks = () => {
    const c = document.getElementById('links-container'); c.innerHTML = '';
    if (!appCfg.links) return;
    Object.entries(appCfg.links).reverse().forEach(([,l]) => {
      const el = document.createElement('div'); el.className = 'task-card';
      el.innerHTML = `
        <img class="task-icon" src="${l.icon}" alt="">
        <div class="task-info"><h3>${l.name}</h3></div>
        <button class="btn btn-ghost" onclick="tg.openLink('${l.url}')">Open ↗</button>`;
      c.appendChild(el);
    });
  };

  const renderRefSection = () => {
    const link = `https://t.me/${appCfg.botUsername}/app?startapp=${tgUser.id}`;
    document.getElementById('ref-section').innerHTML = `
      <div class="ref-card">
        <h3>Invite & Earn 🎁</h3>
        <p>Get ${fmt(appCfg.referralBonus)} ₽ for each referral you bring.</p>
        <div class="ref-input-wrap">
          <input id="ref-link" class="ref-input" value="${link}" readonly>
          <button id="copy-ref" class="btn btn-primary" style="flex-shrink:0;margin-left:0">Copy</button>
        </div>
      </div>`;
  };

  const renderWithdrawSection = () => {
    let opts = '';
    (appCfg.withdrawMethods||[]).forEach(m => { opts += `<option value="${m.name}">${m.name} (Min: ${m.min} ₽)</option>`; });
    const minRefs = appCfg.minimumWithdrawReferrals || 0;
    const notice = minRefs > 0 ? `<p class="form-notice">⚠️ Min <b>${minRefs} referrals</b> required (you have: ${userState.referrals||0})</p>` : '';
    document.getElementById('withdraw-section').innerHTML = `
      <form id="wd-form" class="form-block">
        <h3>Withdrawal Request 💸</h3>
        ${notice}
        <div class="form-group"><label>Method</label><select id="wd-method">${opts}</select></div>
        <div class="form-group"><label>Account / ID</label><input type="text" id="wd-acct" required placeholder="Enter your account"></div>
        <div class="form-group"><label>Amount (₽)</label><input type="number" step="any" id="wd-amount" required placeholder="0.00"></div>
        <button type="submit" id="wd-btn" class="btn btn-primary btn-wide">Submit Request</button>
      </form>`;
  };

  const renderLeaderboard = () => {
    const board = document.querySelector('.lb-btn.active').dataset.board;
    document.getElementById('lb-referral').style.display = board === 'referral' ? 'block' : 'none';
    document.getElementById('lb-earning').style.display  = board === 'earning'  ? 'block' : 'none';
    const listId = board === 'referral' ? 'lb-ref-list' : 'lb-earn-list';
    const items  = leaderboard[board] || [];
    const el     = document.getElementById(listId);
    if (!items.length) { el.innerHTML = '<li style="opacity:.5;padding:12px;font-size:.85rem">No data yet.</li>'; return; }
    const rankClass = i => i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    el.innerHTML = items.map((u,i) => {
      const score = board === 'referral' ? (u.referrals||0) + ' refs' : fmt(u.total_earned) + ' ₽';
      return `<li class="lb-item">
        <span class="lb-rank ${rankClass(i)}">${i < 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</span>
        <img src="${u.photo_url||'https://via.placeholder.com/40'}" alt="">
        <span class="lb-name">${u.first_name||'—'}</span>
        <span class="lb-score">${score}</span>
      </li>`;
    }).join('');
  };

  const renderHistory = () => {
    const el = document.getElementById('history-list');
    if (!userHistory.length) { el.innerHTML = '<p style="opacity:.5;padding:12px;font-size:.85rem">No history yet.</p>'; return; }
    const statusMap = { pending: 'badge-pending', completed: 'badge-completed', rejected: 'badge-rejected' };
    const statusTxt = { pending: 'Pending', completed: 'Done', rejected: 'Rejected' };
    el.innerHTML = userHistory.map(h => `
      <div class="hist-item">
        <div>
          <p>${fmt(h.amount)} ₽ — ${h.method}</p>
          <small>${new Date(h.created_at).toLocaleString()}</small>
        </div>
        <span class="badge ${statusMap[h.status]||''}">${statusTxt[h.status]||h.status}</span>
      </div>`).join('');
  };

  const loadEarningsChart = async () => {
    const data = await api('GET', `/api/user/earnings?userId=${tgUser.id}`);
    const chart = document.getElementById('earnings-chart');
    chart.innerHTML = '';
    const maxV = Math.max(...data.earnings, 1);
    data.earnings.forEach((v, i) => {
      const h = Math.max((v / maxV) * 100, 2);
      const day = new Date(data.dates[i]).toLocaleDateString(undefined, { day: 'numeric' });
      const wrap = document.createElement('div'); wrap.className = 'bar-wrap';
      wrap.innerHTML = `<div class="bar" style="height:${h}%"><span class="tip">${fmt(v)} ₽</span></div><span class="bar-label">${day}</span>`;
      chart.appendChild(wrap);
    });
  };

  // ── handlers ──
  const handleWatchAd = async () => {
    const now = Date.now();
    if ((userState.daily_ad_count||0) >= (appCfg.dailyAdLimit||0)) { tg.showAlert('Daily limit reached.'); return; }
    if (userState.break_until && now < userState.break_until) {
      tg.showAlert(`Wait ${Math.ceil((userState.break_until-now)/60000)} more min.`); return;
    }
    const fn = window[`show_${appCfg.adZoneId}`];
    if (typeof fn !== 'function') { tg.showAlert('Ad network not ready. Try again.'); return; }

    showPopup(`<div class="popup-spin"><div class="loader-ring" style="margin:0 auto 16px"></div><h2>Loading Ad...</h2><p>Please wait a moment</p></div>`);
    try {
      await fn(); closePopup();
      userState = await api('POST', '/api/user/watch-ad', { userId: tgUser.id });
      tg.HapticFeedback.notificationOccurred('success');
      tg.showAlert(`+${fmt(appCfg.adValue)} ₽ added to earning wallet.`);
      renderUI();
    } catch(e) { closePopup(); tg.showAlert('Failed to load ad. Try again.'); }
  };

  const handleMoveBalance = async () => {
    if ((userState.earning_wallet||0) < 100) { tg.showAlert('Minimum 100 ₽ required.'); return; }
    const btn = document.getElementById('move-btn');
    btn.disabled = true; btn.textContent = 'Transferring...';
    try {
      userState = await api('POST', '/api/user/move-balance', { userId: tgUser.id });
      tg.HapticFeedback.notificationOccurred('success');
      tg.showAlert('Successfully transferred!');
    } catch(e) { tg.showAlert('Error. Please try again.'); }
    finally { btn.textContent = 'Transfer to Main Balance'; renderUI(); }
  };

  const handleWithdraw = async e => {
    e.preventDefault();
    const minR = appCfg.minimumWithdrawReferrals || 0;
    if (minR > 0 && (userState.referrals||0) < minR) {
      tg.showAlert(`Need at least ${minR} referrals (you have ${userState.referrals||0}).`); return;
    }
    const method = document.getElementById('wd-method').value;
    const account = document.getElementById('wd-acct').value;
    const amount = parseFloat(document.getElementById('wd-amount').value);
    const sel = (appCfg.withdrawMethods||[]).find(m => m.name === method);
    if (!sel || isNaN(amount) || amount <= 0) { tg.showAlert('Invalid input.'); return; }
    if (amount < sel.min) { tg.showAlert(`Min ${sel.min} ₽ for ${sel.name}`); return; }
    if (amount > (userState.balance||0)) { tg.showAlert('Insufficient balance.'); return; }

    const btn = document.getElementById('wd-btn'); btn.disabled = true; btn.textContent = 'Submitting...';
    try {
      const res = await api('POST', '/api/user/withdraw', { userId: tgUser.id, method, account, amount });
      if (res.error) { tg.showAlert(res.error); return; }
      userState.balance = (userState.balance||0) - amount;
      userHistory.unshift(res.withdrawal);
      tg.HapticFeedback.notificationOccurred('success');
      tg.showAlert('Withdrawal request submitted!');
      document.getElementById('wd-form').reset();
      renderHistory();
    } catch(e) { tg.showAlert('Submission error. Try again.'); }
    finally { btn.disabled = false; btn.textContent = 'Submit Request'; renderUI(); }
  };

  const handleClaimTask = async e => {
    const btn = e.target.closest('button[data-task]');
    if (!btn || btn.disabled) return;
    const taskId = btn.dataset.task, taskUrl = btn.dataset.url;
    tg.openLink(taskUrl);
    btn.disabled = true; btn.textContent = 'Claiming...';
    setTimeout(async () => {
      try {
        const r = await api('POST', '/api/task/claim', { userId: tgUser.id, taskId });
        if (r.error) { btn.disabled = false; btn.textContent = 'Claim'; tg.showAlert(r.error); return; }
        if (!userState.completedTasks) userState.completedTasks = {};
        userState.completedTasks[taskId] = true;
        userState.balance = (userState.balance||0) + r.reward;
        tg.HapticFeedback.notificationOccurred('success');
        tg.showAlert(`+${fmt(r.reward)} ₽ earned!`);
        renderUI();
      } catch(e) { btn.disabled = false; btn.textContent = 'Claim'; }
    }, 5000);
  };

  const copyRef = () => {
    const inp = document.getElementById('ref-link'); inp.select();
    navigator.clipboard.writeText(inp.value).then(() => {
      tg.HapticFeedback.notificationOccurred('success');
      tg.showAlert('Referral link copied!');
    }).catch(() => { document.execCommand('copy'); tg.showAlert('Copied!'); });
  };

  // ── nav ──
  const setupNav = () => {
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const pg = btn.dataset.page;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pg).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (pg === 'profile-page')     renderHistory();
        if (pg === 'leaderboard-page') renderLeaderboard();
      });
    });
  };

  const setupEvents = () => {
    document.getElementById('move-btn').addEventListener('click', handleMoveBalance);
    document.getElementById('bonus-tasks').addEventListener('click', handleClaimTask);
    document.getElementById('profile-page').addEventListener('submit', e => {
      if (e.target.id === 'wd-form') handleWithdraw(e);
    });
    document.getElementById('ref-section').addEventListener('click', e => {
      if (e.target.id === 'copy-ref') copyRef();
    });
    document.querySelector('.lb-toggle').addEventListener('click', e => {
      const btn = e.target.closest('.lb-btn'); if (!btn) return;
      document.querySelectorAll('.lb-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderLeaderboard();
    });
  };

  initApp();
});
</script>
</body>
</html>
